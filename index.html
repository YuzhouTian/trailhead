<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Trailhead</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#2d6a4f" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" href="./icon-180.png" />
</head>
<body>
  <div id="map"></div>

  <div id="searchWrap">
    <input type="search" id="searchInput" placeholder="Place, grid ref (NY 215 072) or lat, lng"
           autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
    <button id="searchClear" class="hidden">&times;</button>
  </div>
  <div id="searchResults" class="hidden"></div>

  <div id="statusBanner" class="hidden"></div>

  <nav id="bottomBar">
    <button id="btnMap"><span class="ico">&#128506;</span><span class="lbl">Map</span></button>
    <button id="btnRoutes"><span class="ico">&#128193;</span><span class="lbl">Routes</span></button>
    <button id="btnPlan"><span class="ico">&#9999;&#65039;</span><span class="lbl">Plan</span></button>
    <button id="btnLocate"><span class="ico" id="locateIco">&#9678;</span><span class="lbl">Me</span></button>
    <button id="btnSettings"><span class="ico">&#9881;&#65039;</span><span class="lbl">Settings</span></button>
  </nav>

  <div id="routeCard" class="hidden">
    <div id="rcHeader">
      <div id="rcInfo">
        <div id="rcName"></div>
        <div id="rcStats"></div>
        <div id="rcRemaining" class="hidden"></div>
      </div>
      <button id="rcChart" title="Elevation profile">&#9968;</button>
      <button id="rcOffline" title="Download tiles for offline use">&#8681;</button>
      <button id="rcClose" title="Hide route">&times;</button>
    </div>
    <div id="elevChart" class="hidden"></div>
  </div>

  <div id="panel" class="hidden">
    <div id="panelContent"></div>
  </div>

  <div id="planBar" class="hidden">
    <span id="planStats">Tap the map to add points</span>
    <div class="planBtns">
      <button id="planSnap" class="active" title="Snap to paths on/off">&#129522;</button>
      <button id="planUndo">Undo</button>
      <button id="planClear">Clear</button>
      <button id="planSave">Save</button>
      <button id="planExport">GPX</button>
      <button id="planDone">Done</button>
    </div>
  </div>

  <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" class="hidden" />

  <div id="toast" class="hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
