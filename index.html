<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Trailhead</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#2d6a4f" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" href="./icon-180.png" />
  <!-- Set the theme before first paint so a forced light/dark choice doesn't flash the wrong colours. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('trailhead.settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Icon sprite: monochrome glyphs that inherit currentColor (recolour per theme / active state). -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-map" viewBox="0 0 24 24"><path class="gico" d="M12 3 2.6 8 12 13l9.4-5L12 3Z"/><path class="gico" d="M2.6 12.4 12 17.4l9.4-5"/></symbol>
    <symbol id="i-routes" viewBox="0 0 24 24"><circle class="gico" cx="5.5" cy="18.5" r="2"/><circle class="gico" cx="18.5" cy="5.5" r="2"/><path class="gico" d="M7.2 17C9.5 13.5 15 11 17 7.3"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><path class="gico" d="m4.5 19.5 4-1L20 7a1.9 1.9 0 0 0-2.7-2.7L5.8 15.9l-1.3 3.6Z"/><path class="gico" d="m14.5 6.3 3.2 3.2"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="4"/><path class="gico" d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2"/></symbol>
    <symbol id="i-locate-on" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1.9" fill="currentColor"/><path class="gico" d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><path class="gico" d="M3.5 11 20.5 4.5 14 20.5l-2.7-7.8L3.5 11z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path class="gico" d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"/><circle class="gico" cx="15" cy="7" r="2.3"/><circle class="gico" cx="8.5" cy="17" r="2.3"/></symbol>
    <symbol id="i-elev" viewBox="0 0 24 24"><path class="gico" d="M3 19h18"/><path class="gico" d="m3 16 5-7 4 4.5 3-4 6 6.5"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path class="gico" d="M12 3.5v10m0 0 3.6-3.6M12 13.5 8.4 9.9"/><path class="gico" d="M4.5 16.5V19a1 1 0 0 0 1 1h13a1 1 0 0 0 1-1v-2.5"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path class="gico" d="M4 19V11a8 8 0 0 1 16 0v8h-5v-8a3 3 0 0 0-6 0v8z"/><path class="gico" d="M4 15h5M15 15h5"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle class="gico" cx="11" cy="11" r="7"/><path class="gico" d="m20 20-3.6-3.6"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="4"/><path class="gico" d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.4 1.4M17.6 17.6 19 19M19 5l-1.4 1.4M6.4 17.6 5 19"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path class="gico" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor"/></symbol>
  </svg>

  <div id="map"></div>

  <div id="searchWrap">
    <span class="searchIco"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></span>
    <input type="search" id="searchInput" placeholder="Place, grid ref (NY 215 072) or lat, lng"
           autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
    <button id="searchClear" class="hidden">&times;</button>
  </div>
  <div id="searchResults" class="hidden"></div>

  <div id="statusBanner" class="hidden"></div>

  <nav id="bottomBar">
    <button id="btnMap"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-map"/></svg></span><span class="lbl">Map</span></button>
    <button id="btnRoutes"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-routes"/></svg></span><span class="lbl">Routes</span></button>
    <button id="btnPlan"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-plan"/></svg></span><span class="lbl">Plan</span></button>
    <button id="btnLocate"><span class="ico" id="locateIco"><svg viewBox="0 0 24 24"><use href="#i-locate"/></svg></span><span class="lbl">Me</span></button>
    <button id="btnSettings"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-settings"/></svg></span><span class="lbl">Settings</span></button>
  </nav>

  <div id="routeCard" class="hidden">
    <div id="rcHeader">
      <div id="rcInfo">
        <div id="rcName"></div>
        <div id="rcStats"></div>
        <div id="rcRemaining" class="hidden"></div>
      </div>
      <button id="rcChart" title="Elevation profile"><svg viewBox="0 0 24 24"><use href="#i-elev"/></svg></button>
      <button id="rcOffline" title="Download tiles for offline use"><svg viewBox="0 0 24 24"><use href="#i-download"/></svg></button>
      <button id="rcClose" title="Hide route">&times;</button>
    </div>
    <div id="elevChart" class="hidden"></div>
  </div>

  <div id="panel" class="hidden">
    <div id="panelContent"></div>
  </div>

  <div id="planBar" class="hidden">
    <span id="planStats">Tap the map to add points</span>
    <div class="planBtns">
      <button id="planSnap" class="active" title="Snap to paths on/off"><svg viewBox="0 0 24 24"><use href="#i-magnet"/></svg></button>
      <button id="planUndo">Undo</button>
      <button id="planClear">Clear</button>
      <button id="planSave">Save</button>
      <button id="planExport">GPX</button>
      <button id="planDone">Done</button>
    </div>
  </div>

  <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" class="hidden" />

  <div id="toast" class="hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
