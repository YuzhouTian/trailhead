<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Trailhead</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#ffffff" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="apple-touch-icon" href="./icon-180.png" />
  <link rel="icon" href="./icon-180.png" />
  <!-- Set the theme before first paint so a forced light/dark choice doesn't flash the wrong colours. -->
  <script>
    try {
      var s = JSON.parse(localStorage.getItem('trailhead.settings') || '{}');
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
    } catch (e) {}
  </script>
</head>
<body>
  <!-- Icon sprite: monochrome glyphs that inherit currentColor (recolour per theme / active state).

       One drawing grammar for the whole set, so nothing looks borrowed from a
       different app: a 24x24 grid, 2px stroke, round caps and joins, no fill,
       and about 1.5px of clear space all round so a glyph never touches the
       edge of its box (icons are shown as small as 13px here, and a path that
       runs into the edge reads as a smudge at that size).

       Three families share the grid:
         i-*  interface icons (tabs, buttons)
         c-*  categories of a pin you saved yourself
         p-*  categories of a nearby point found on OpenStreetMap
       Where a saved-pin category and a nearby category mean the same thing the
       p-* symbol reuses the c-* drawing, so the map key cannot drift from the
       markers it is explaining. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-map" viewBox="0 0 24 24"><path class="gico" d="M3 6.5 9 4l6 2.5 6-2.5v13.5L15 20l-6-2.5-6 2.5z"/><path class="gico" d="M9 4v13.5M15 6.5V20"/></symbol>
    <symbol id="i-routes" viewBox="0 0 24 24"><circle class="gico" cx="5.5" cy="18.5" r="2.5"/><circle class="gico" cx="18.5" cy="5.5" r="2.5"/><path class="gico" d="M7.3 16.7C9.5 13.5 14.5 12.5 16.7 7.3"/></symbol>
    <symbol id="i-plan" viewBox="0 0 24 24"><path class="gico" d="m4 20 1.2-4.2L16.4 4.6a2.2 2.2 0 0 1 3.1 3.1L8.3 18.8z"/><path class="gico" d="m14.6 6.4 3 3"/></symbol>
    <symbol id="i-locate" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="3.5"/><path class="gico" d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></symbol>
    <!-- The centre dot is the "you have a fix" tell, so it is a solid fill and
         carries its own opacity: the duotone rule that tints an active icon
         must not wash it out. -->
    <symbol id="i-locate-on" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="3.5"/><circle class="gsolid" cx="12" cy="12" r="1.8" fill="currentColor" fill-opacity="1"/><path class="gico" d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><path class="gico" d="M3.5 11 20.5 4.5 14 20.5l-2.7-7.8z"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path class="gico" d="M4 7h9M18.5 7H20M4 17h3M12.5 17H20"/><circle class="gico" cx="15.5" cy="7" r="2.5"/><circle class="gico" cx="9.5" cy="17" r="2.5"/></symbol>
    <symbol id="i-elev" viewBox="0 0 24 24"><path class="gico" d="M3 18h18"/><path class="gico" d="m3 15 5.5-7.5 3.5 4 3-4L21 15"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path class="gico" d="M12 4v11m0 0 4-4m-4 4-4-4"/><path class="gico" d="M4 17v1.5A1.5 1.5 0 0 0 5.5 20h13a1.5 1.5 0 0 0 1.5-1.5V17"/></symbol>
    <symbol id="i-magnet" viewBox="0 0 24 24"><path class="gico" d="M5 11a7 7 0 0 1 14 0v8h-4.5v-8a2.5 2.5 0 0 0-5 0v8H5z"/><path class="gico" d="M5 15h4.5M14.5 15H19"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle class="gico" cx="11" cy="11" r="6.5"/><path class="gico" d="m20.5 20.5-4.8-4.8"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path class="gico" d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path class="gico" d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path class="gico" d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="4"/><path class="gico" d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path class="gico" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></symbol>
    <symbol id="i-auto" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="8.5"/><path class="gsolid" d="M12 3.5a8.5 8.5 0 0 0 0 17Z" fill="currentColor" fill-opacity="1"/></symbol>
    <symbol id="i-ele" viewBox="0 0 24 24"><path class="gico" d="M3 18l6-8.5 4 5 3-4 5 7.5z"/></symbol>
    <symbol id="i-save" viewBox="0 0 24 24"><path class="gico" d="M5 5.5A1.5 1.5 0 0 1 6.5 4H16l4 4v10.5a1.5 1.5 0 0 1-1.5 1.5h-12A1.5 1.5 0 0 1 5 18.5z"/><path class="gico" d="M8 4v5h7M8 20v-6h8v6"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path class="gico" d="M4 7h16M9.5 7V4.5h5V7M6.5 7l.8 12.2a1 1 0 0 0 1 .8h7.4a1 1 0 0 0 1-.8L17.5 7"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect class="gico" x="9" y="9" width="11" height="11" rx="2.5"/><path class="gico" d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></symbol>
    <symbol id="i-share" viewBox="0 0 24 24"><circle class="gico" cx="6" cy="12" r="2.5"/><circle class="gico" cx="18" cy="5.5" r="2.5"/><circle class="gico" cx="18" cy="18.5" r="2.5"/><path class="gico" d="m8.2 10.8 7.6-4.1M8.2 13.2l7.6 4.1"/></symbol>
    <symbol id="i-pin" viewBox="0 0 24 24"><path class="gsolid" d="M12 22s7-6.6 7-12A7 7 0 0 0 5 10c0 5.4 7 12 7 12z" fill="currentColor" fill-opacity="1"/><circle cx="12" cy="10" r="2.6" fill="#fff"/></symbol>

    <!-- Saved-pin categories -->
    <symbol id="c-summit" viewBox="0 0 24 24"><path class="gico" d="m3 19 6-11 3.5 5.5L15 10l6 9z"/></symbol>
    <symbol id="c-viewpoint" viewBox="0 0 24 24"><path class="gico" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle class="gico" cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="c-water" viewBox="0 0 24 24"><path class="gico" d="M12 3.5s6 6.3 6 10a6 6 0 0 1-12 0c0-3.7 6-10 6-10z"/></symbol>
    <symbol id="c-camp" viewBox="0 0 24 24"><path class="gico" d="M12 4 3.5 20h17z"/><path class="gico" d="M12 12v8"/></symbol>
    <symbol id="c-parking" viewBox="0 0 24 24"><rect class="gico" x="4" y="4" width="16" height="16" rx="3.5"/><path class="gico" d="M9.5 16V8h3.2a2.4 2.4 0 0 1 0 4.8H9.5"/></symbol>
    <symbol id="c-other" viewBox="0 0 24 24"><path class="gico" d="M6 21V4h10l-2 3.5 2 3.5H6"/></symbol>

    <!-- Nearby-point categories (src/poi.ts). One per row of that table. -->
    <symbol id="p-summit" viewBox="0 0 24 24"><path class="gico" d="m3 19 6-11 3.5 5.5L15 10l6 9z"/></symbol>
    <symbol id="p-trig" viewBox="0 0 24 24"><path class="gico" d="M12 4 4 19h16z"/><path class="gico" d="M12 4v15"/></symbol>
    <symbol id="p-viewpoint" viewBox="0 0 24 24"><path class="gico" d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"/><circle class="gico" cx="12" cy="12" r="2.5"/></symbol>
    <symbol id="p-water" viewBox="0 0 24 24"><path class="gico" d="M12 3.5s6 6.3 6 10a6 6 0 0 1-12 0c0-3.7 6-10 6-10z"/></symbol>
    <symbol id="p-waterfall" viewBox="0 0 24 24"><path class="gico" d="M3.5 5.5h17"/><path class="gico" d="M7.5 6.5v7M12 6.5v9M16.5 6.5v7"/><path class="gico" d="M3.5 19c2-1.6 3.6.8 5.6-.8s3.6.8 5.6-.8 3.6.8 5.3-.6"/></symbol>
    <symbol id="p-shelter" viewBox="0 0 24 24"><path class="gico" d="M4 11 12 4l8 7"/><path class="gico" d="M6.5 9.5V20h11V9.5"/><path class="gico" d="M10 20v-5h4v5"/></symbol>
    <symbol id="p-camp" viewBox="0 0 24 24"><path class="gico" d="M12 4 3.5 20h17z"/><path class="gico" d="M12 12v8"/></symbol>
    <symbol id="p-cafe" viewBox="0 0 24 24"><path class="gico" d="M4 8h12v6a4 4 0 0 1-4 4H8a4 4 0 0 1-4-4z"/><path class="gico" d="M16 10h2a2 2 0 0 1 0 4h-2M6 21h8"/></symbol>
    <!-- The international WC sign: two figures, skirt on the right. A toilet
         drawn in side view reads as the coffee mug next to it at 13px. -->
    <symbol id="p-toilets" viewBox="0 0 24 24"><circle class="gico" cx="6.5" cy="4.5" r="1.8"/><path class="gico" d="M6.5 9v5.5M4.2 20 6.5 14.5 8.8 20M4.3 10.5h4.4"/><circle class="gico" cx="17.5" cy="4.5" r="1.8"/><path class="gico" d="m17.5 8.5-3 7h6zM17.5 15.5V20"/><path class="gico" d="M12 3.5v17"/></symbol>
    <symbol id="p-parking" viewBox="0 0 24 24"><rect class="gico" x="4" y="4" width="16" height="16" rx="3.5"/><path class="gico" d="M9.5 16V8h3.2a2.4 2.4 0 0 1 0 4.8H9.5"/></symbol>
    <symbol id="p-bus" viewBox="0 0 24 24"><rect class="gico" x="4" y="3.5" width="16" height="13.5" rx="2.5"/><path class="gico" d="M4 10.5h16"/><path class="gico" d="M7.5 14h.8M15.7 14h.8"/><path class="gico" d="M7.5 17 6 20.5M16.5 17 18 20.5"/></symbol>
    <symbol id="p-picnic" viewBox="0 0 24 24"><path class="gico" d="M3 8h18"/><path class="gico" d="m6.5 8-2.5 12M17.5 8l2.5 12M5.2 14h13.6"/></symbol>
    <symbol id="p-star" viewBox="0 0 24 24"><path class="gico" d="M12 3.5 14.6 9l6 .7-4.5 4 1.3 6-5.4-3.1L6.6 19.7l1.3-6-4.5-4 6-.7z"/></symbol>
    <symbol id="p-cave" viewBox="0 0 24 24"><path class="gico" d="M3.5 20v-7a8.5 8.5 0 0 1 17 0v7"/><path class="gico" d="M9 20v-3.5a3 3 0 0 1 6 0V20"/></symbol>
    <symbol id="p-emergency" viewBox="0 0 24 24"><circle class="gico" cx="12" cy="12" r="8.5"/><path class="gico" d="M12 7.5v9M7.5 12h9"/></symbol>
  </svg>

  <div id="map"></div>

  <div id="searchWrap">
    <span class="searchIco"><svg viewBox="0 0 24 24"><use href="#i-search"/></svg></span>
    <input type="search" id="searchInput" placeholder="Place, grid ref (NY 215 072) or lat, lng"
           autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" />
    <button id="searchClear" class="hidden" aria-label="Clear search"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
  </div>
  <div id="searchResults" class="hidden"></div>

  <div id="statusBanner" class="hidden"></div>

  <button id="btnLocate" title="Locate me"><span class="ico" id="locateIco"><svg viewBox="0 0 24 24"><use href="#i-locate"/></svg></span></button>

  <nav id="bottomBar">
    <button id="btnMap"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-map"/></svg></span><span class="lbl">Map</span></button>
    <button id="btnRoutes"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-routes"/></svg></span><span class="lbl">Saved</span></button>
    <button id="btnPlan"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-plan"/></svg></span><span class="lbl">Plan</span></button>
    <button id="btnSettings"><span class="ico"><svg viewBox="0 0 24 24"><use href="#i-settings"/></svg></span><span class="lbl">Settings</span></button>
  </nav>

  <div id="routeCard" class="hidden">
    <div id="rcHeader">
      <div id="rcInfo">
        <div id="rcName"></div>
        <div id="rcStats"></div>
        <div id="rcRemaining" class="hidden"></div>
      </div>
      <button id="rcChart" title="Elevation profile"><svg viewBox="0 0 24 24"><use href="#i-elev"/></svg></button>
      <button id="rcOffline" title="Download tiles for offline use"><svg viewBox="0 0 24 24"><use href="#i-download"/></svg></button>
      <button id="rcClose" title="Hide route" aria-label="Hide route"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div id="elevChart" class="hidden"></div>
  </div>

  <div id="pinCard" class="hidden"></div>

  <!-- The dimmed backdrop behind an open sheet. It is what makes the sheet feel
       like a layer over the map rather than part of it, and tapping it is the
       fastest way to put the sheet away one-handed. -->
  <div id="panelScrim" class="hidden"></div>

  <div id="panel" class="hidden">
    <!-- The sheet's own chrome, above whatever panel is loaded into it: the grab
         handle in the middle and the close button on the right. It stays put
         while the panel scrolls under it, so the way out of a long panel is in
         the same place as the way out of a short one. Dragging the handle down
         throws the sheet away — ui/sheet.ts. -->
    <div id="panelHead">
      <span id="panelGrab" aria-hidden="true"></span>
      <button id="panelClose" class="closeX" aria-label="Close"><svg viewBox="0 0 24 24"><use href="#i-close"/></svg></button>
    </div>
    <div id="panelContent"></div>
  </div>

  <div id="planBar" class="hidden">
    <span id="planStats">Tap the map to add points</span>
    <div class="planBtns">
      <button id="planSnap" class="active" title="Snap to paths on/off"><svg viewBox="0 0 24 24"><use href="#i-magnet"/></svg></button>
      <button id="planUndo">Undo</button>
      <button id="planClear">Clear</button>
      <button id="planDone">Done</button>
    </div>
  </div>

  <div id="qrScan" class="hidden">
    <video id="qrVideo" playsinline muted></video>
    <div id="qrFrame"></div>
    <div id="qrHint">Point at the route's QR code on your computer</div>
    <button id="qrCancel">Cancel</button>
  </div>

  <input type="file" id="gpxFile" accept=".gpx,application/gpx+xml" class="hidden" />

  <div id="toast" class="hidden"></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
